---
name: Doris Pipeline
on:
  pull_request:
  push:
    branches:
      - 'master'

jobs:
  license-check:
    name: "License Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@v2
      - name: Check License
        uses: apache/skywalking-eyes@v0.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checkstyle:
    name: "CheckStyle"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Run java checkstyle
        run:
          cd flink-doris-connector && mvn clean compile checkstyle:checkstyle

  build-connector:
    name: "Build Connector"
    needs: [license-check, checkstyle]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '8'
          cache: maven


      - name: Build flink connector 1.15
        run: |
          cd flink-doris-connector && mvn clean package \
            -Dflink.version=1.15.0 \
            -Dflink.minor.version=1.15 \
            -Dflink.python.id=flink-python_2.12

      - name: Build flink connector 1.16
        run: |
          cd flink-doris-connector && mvn clean package \
            -Dflink.version=1.16.0 \
            -Dflink.minor.version=1.16 \
            -Dflink.python.id=flink-python

      - name: Build flink connector 1.17
        run: |
          cd flink-doris-connector && mvn clean package \
            -Dflink.version=1.17.0 \
            -Dflink.minor.version=1.17 \
            -Dflink.python.id=flink-python

      - name: Build flink connector 1.18
        run: |
          cd flink-doris-connector && mvn clean package \
            -Dflink.version=1.18.0 \
            -Dflink.minor.version=1.18 \
            -Dflink.python.id=flink-python

      - name: Build flink connector 1.19
        run: |
          cd flink-doris-connector && mvn clean package \
            -Dflink.version=1.19.0 \
            -Dflink.minor.version=1.19 \
            -Dflink.python.id=flink-python

      - name: Build flink connector 1.20
        run: |
          cd flink-doris-connector && mvn clean package \
            -Dflink.version=1.20.0 \
            -Dflink.minor.version=1.20 \
            -Dflink.python.id=flink-python

  run-itcases:
    name: "Run ITCases"
    needs: [run-e2ecases]
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Clean Docker resources
        run: docker system prune -f -a

      - name: Check Docker resources
        run: |
          echo "=== Docker Info ==="
          docker info
          echo "=== Docker System DF ==="
          docker system df

      - name: Run ITCases
        run: |
          cd flink-doris-connector && mvn test -Dtest="*ITCase" -Dimage="yagagagaga/doris-standalone:2.1.7"

      - name: Clean resources
        if: always()
        run: |
          docker system prune -f
          cd flink-doris-connector && mvn clean

  run-e2ecases:
    name: "Run E2ECases"
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Clean Docker resources
        run: docker system prune -f -a

      - name: Run E2ECases
        run: |
          cd flink-doris-connector && mvn test -Dtest="*E2ECase" -Dimage="yagagagaga/doris-standalone:2.1.7"

      - name: Clean resources
        if: always()
        run: |
          docker system prune -f
          cd flink-doris-connector && mvn clean