---
name: Build Connector
on:
  pull_request:
  push:

jobs:
  build-extension:
    name: "Build Connector (Flink ${{ matrix.flink.version }}, Java ${{ matrix.java-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [8, 11]
        flink:
          - { version: "1.15.0", minor: "1.15", python_id: "flink-python_2.12" }
          - { version: "1.16.0", minor: "1.16", python_id: "flink-python" }
          - { version: "1.17.0", minor: "1.17", python_id: "flink-python" }
          - { version: "1.18.0", minor: "1.18", python_id: "flink-python" }
          - { version: "1.19.0", minor: "1.19", python_id: "flink-python" }
          - { version: "1.20.0", minor: "1.20", python_id: "flink-python" }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: Cache Maven Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-java${{ matrix.java-version }}-flink${{ matrix.flink.minor }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-java${{ matrix.java-version }}-flink${{ matrix.flink.minor }}-
            ${{ runner.os }}-maven-java${{ matrix.java-version }}-
            ${{ runner.os }}-maven-

      - name: Build Flink Connector
        run: |
          cd flink-doris-connector && mvn clean package \
            -Dflink.version=${{ matrix.flink.version }} \
            -Dflink.minor.version=${{ matrix.flink.minor }} \
            -Dflink.python.id=${{ matrix.flink.python_id }}